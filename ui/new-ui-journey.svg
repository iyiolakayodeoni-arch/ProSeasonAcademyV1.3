      <stop offset="0%" stop-color="#0e1712"/><stop offset="60%" stop-color="#0b130d"/>
      <stop offset="100%" stop-color="#39FF6A" stop-opacity="0.16"/></linearGradient>
    <radialGradient id="phalo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#39FF6A" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#39FF6A" stop-opacity="0.03"/></radialGradient>
    <linearGradient id="psheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF6A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39FF6A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#39FF6A" stop-opacity="0"/></linearGradient>
    <!-- role model card -->
