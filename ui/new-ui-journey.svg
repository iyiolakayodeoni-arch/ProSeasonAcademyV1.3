<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1180" viewBox="0 0 780 1180" font-family="monospace">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="rgba(57,255,106,0.045)" stroke-width="1"/>
