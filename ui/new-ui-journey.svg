      <stop offset="70%" stop-color="#f2c078" stop-opacity="0.04"/></radialGradient>
    <linearGradient id="rplate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2c078"/><stop offset="100%" stop-color="#856b3f"/></linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="11" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#39FF6A" flood-opacity="0.35"/>
    </filter>
