<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1380" viewBox="0 0 780 1380" font-family="monospace">
  <defs>
    <pattern id="grid2" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="rgba(57,255,106,0.045)" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF6A" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#39FF6A" stop-opacity="0.04"/>
    </radialGradient>
    <filter id="drop2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#39FF6A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="780" height="1380" fill="#0a0f0a"/>
  <rect width="780" height="1380" fill="url(#grid2)"/>

  <!-- phone frame -->
  <rect x="30" y="30" width="720" height="1320" rx="44" fill="#070b07" stroke="#1f3826" stroke-width="2"/>
  <rect x="48" y="60" width="684" height="1260" rx="28" fill="#0a0f0a"/>
  <rect x="48" y="60" width="684" height="1260" rx="28" fill="url(#grid2)"/>
  <!-- status bar -->
  <text x="70" y="100" font-size="11" letter-spacing="1.4" fill="#7a9c88">9:41</text>
  <text x="710" y="100" font-size="11" letter-spacing="1.4" fill="#7a9c88" text-anchor="end">PRO SEASON</text>

  <!-- eyebrow -->
  <text x="390" y="178" font-size="13" font-weight="900" letter-spacing="4" fill="#39FF6A" text-anchor="middle">THE EVIDENCE HOLDS</text>

  <!-- sealing badge with burst + halo -->
  <circle cx="390" cy="320" r="96" fill="url(#halo2)"/>
  <circle cx="390" cy="320" r="84" fill="none" stroke="#39FF6A" stroke-width="1.6" opacity="0.4"/>
  <g transform="translate(318 248)" filter="url(#glow2)">
    <path d="M50 6 L86 24 L86 58 C86 76 70 88 50 94 C30 88 14 76 14 58 L14 24 Z" fill="rgba(57,255,106,0.12)"/>
    <path d="M50 6 L86 24 L86 58 C86 76 70 88 50 94 C30 88 14 76 14 58 L14 24 Z" fill="none" stroke="#39FF6A" stroke-width="2.6" stroke-opacity="0.95" stroke-linejoin="round"/>
    <!-- READ THE GAME crest: lattice -->
    <line x1="32" y1="38" x2="68" y2="38" stroke="#39FF6A" stroke-width="2.6"/>
    <line x1="32" y1="50" x2="68" y2="50" stroke="#39FF6A" stroke-width="2.6"/>
    <line x1="32" y1="62" x2="68" y2="62" stroke="#39FF6A" stroke-width="2.6"/>
    <line x1="38" y1="36" x2="38" y2="64" stroke="#39FF6A" stroke-width="2.6"/>
    <line x1="50" y1="36" x2="50" y2="64" stroke="#39FF6A" stroke-width="2.6"/>
    <line x1="62" y1="36" x2="62" y2="64" stroke="#39FF6A" stroke-width="2.6"/>
    <circle cx="50" cy="50" r="3" fill="#39FF6A"/>
  </g>

  <text x="390" y="470" font-size="34" font-weight="900" letter-spacing="3" fill="#eef2ec" text-anchor="middle">STAGE 3 CLEARED</text>
  <text x="390" y="500" font-size="18" font-weight="800" letter-spacing="2.4" fill="#39FF6A" text-anchor="middle">READ THE GAME</text>

  <!-- coach attestation -->
  <rect x="96" y="536" width="588" height="64" rx="12" fill="rgba(15,26,19,0.6)" stroke="#2c6638" stroke-width="1.1"/>
  <circle cx="132" cy="568" r="18" fill="#243021" stroke="#2c6638" stroke-width="1.2"/>
  <circle cx="132" cy="562" r="6.5" fill="#394234"/>
  <path d="M118 584 a14 14 0 0 1 28 0" fill="#394234"/>
  <text x="164" y="566" font-size="9" font-weight="700" letter-spacing="0.8" fill="#c4d4c8">CHINEDU OKAFOR WATCHED THE TAPE. THE LEDGER SAYS THE</text>
  <text x="164" y="582" font-size="9" font-weight="700" letter-spacing="0.8" fill="#c4d4c8">WORK WAS DONE — NOT WHAT YOU HOPED, WHAT YOU DID.</text>

  <!-- receipts card -->
  <rect x="96" y="624" width="588" height="188" rx="14" fill="rgba(12,20,14,0.7)" stroke="#2c6638" stroke-width="1.1"/>
  <text x="118" y="656" font-size="11" font-weight="900" letter-spacing="1.8" fill="#f2c078">THE RECEIPTS THAT CLEARED IT</text>
  <g transform="translate(118 680)">
    <circle cx="11" cy="11" r="11" fill="none" stroke="#39FF6A" stroke-width="1.7"/>
    <path d="M6.5 11.5 l3 3 6-7" stroke="#39FF6A" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="15" font-size="13" font-weight="700" fill="#cdd9cf">Hit 65%+ pass accuracy in 2 matches</text>
    <text x="546" y="15" font-size="12" font-weight="900" fill="#39FF6A" text-anchor="end">2/2</text>
  </g>
  <g transform="translate(118 724)">
    <circle cx="11" cy="11" r="11" fill="none" stroke="#39FF6A" stroke-width="1.7"/>
    <path d="M6.5 11.5 l3 3 6-7" stroke="#39FF6A" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="15" font-size="13" font-weight="700" fill="#cdd9cf">Score 3 goals against a low block</text>
    <text x="546" y="15" font-size="12" font-weight="900" fill="#39FF6A" text-anchor="end">3/3</text>
  </g>
  <g transform="translate(118 768)">
    <circle cx="11" cy="11" r="11" fill="none" stroke="#39FF6A" stroke-width="1.7"/>
    <path d="M6.5 11.5 l3 3 6-7" stroke="#39FF6A" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="15" font-size="13" font-weight="700" fill="#cdd9cf">Rate your head state on 2 matches</text>
    <text x="546" y="15" font-size="12" font-weight="900" fill="#39FF6A" text-anchor="end">2/2</text>
  </g>

  <!-- card step-up -->
  <rect x="96" y="836" width="588" height="186" rx="14" fill="rgba(12,20,14,0.94)" stroke="#2c6638" stroke-width="1.2" filter="url(#drop2)"/>
  <text x="118" y="868" font-size="11" font-weight="900" letter-spacing="1.8" fill="#8fb89b">YOUR CARD</text>
  <!-- before -->
  <text x="150" y="950" font-size="30" font-weight="900" fill="rgba(143,184,155,0.7)" text-anchor="middle">72</text>
  <text x="150" y="972" font-size="9" letter-spacing="1.4" fill="rgba(143,184,155,0.5)" text-anchor="middle">BEFORE</text>
  <!-- arrow + delta -->
  <path d="M222 938 l26 0 M240 930 l8 8 -8 8" stroke="#39FF6A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="245" y="958" font-size="13" font-weight="900" fill="#ffcf7a" text-anchor="middle">+6</text>
  <!-- after with ring -->
  <g transform="translate(560 929)">
    <circle cx="0" cy="0" r="42" stroke="rgba(57,255,106,0.16)" stroke-width="3.2" fill="none"/>
    <circle cx="0" cy="0" r="42" stroke="#ffcf7a" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="105.5" transform="rotate(-90)"/>
    <text x="0" y="8" text-anchor="middle" font-size="30" font-weight="900" fill="#ffcf7a">78</text>
  </g>
  <text x="560" y="998" font-size="9" letter-spacing="1.4" fill="#8fb89b" text-anchor="middle">OVR · ASCENT 50%</text>
  <line x1="118" y1="1016" x2="662" y2="1016" stroke="#1f3826" stroke-width="1"/>
  <text x="118" y="1038" font-size="13" font-weight="900" letter-spacing="1.4" fill="#39FF6A">+180 XP</text>
  <text x="662" y="1038" font-size="10" letter-spacing="1" fill="#8fb89b" text-anchor="end">ASCENT 33% → 50%</text>

  <!-- next door -->
  <rect x="96" y="1052" width="6" height="44" fill="#f2c078"/>
  <text x="118" y="1076" font-size="11" font-weight="700" letter-spacing="0.8" fill="#eef2ec">STAGE 4 — BUILD DISCIPLINE IS OPEN.</text>
  <text x="118" y="1092" font-size="11" font-weight="700" letter-spacing="0.8" fill="#eef2ec">THE PATH ONLY MOVES FORWARD.</text>

  <!-- CTA -->
  <rect x="96" y="1120" width="588" height="60" rx="14" fill="#39FF6A"/>
  <text x="390" y="1157" font-size="15" font-weight="900" letter-spacing="2.6" fill="#05130a" text-anchor="middle">BACK TO THE MAP ›</text>

  <text x="390" y="1230" font-size="10" letter-spacing="2.2" fill="rgba(143,184,155,0.45)" text-anchor="middle">YOU CANNOT OUTRUN YOUR RECEIPTS.</text>
</svg>
